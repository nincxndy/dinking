<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หารค่าเหล้า</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{--bg:#fbf7f0;--card:#fff;--text:#2a2118;--muted:#7a6c5d;--line:#e8dfd2;--accent:#c2410c;--accent2:#fde6d6;--ok:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120d;--card:#231c15;--text:#f3ebe0;--muted:#a89885;--line:#3a3025;--accent:#fb923c;--accent2:#3b2615;--ok:#4ade80;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input[type=number],select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input:focus{outline:2px solid var(--accent);outline-offset:0}
.grow{flex:1 1 140px}
.num{width:90px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:var(--accent2);color:var(--accent)}
button.x{background:transparent;color:var(--muted);padding:4px 8px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;background:var(--accent2);color:var(--accent);border-radius:999px;padding:2px 4px 2px 12px;font-weight:600}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:0}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.who label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;cursor:pointer;user-select:none}
.who label.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
.who input{display:none}
.opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.opts label{display:flex;align-items:center;gap:6px}
.res{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:18px}
.res:first-of-type{border-top:0}
.res b{color:var(--accent)}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:20px;padding-top:10px;border-top:2px solid var(--line);margin-top:4px}
.muted{color:var(--muted);font-size:14px}
.empty{color:var(--muted);text-align:center;padding:10px}
.table-wrap{overflow-x:auto}
</style>
</head>
<body>
<main>
  <h1>🍻 หารค่าเหล้า</h1>
  <p class="sub">ใส่รายชื่อเพื่อน เพิ่มรายการที่สั่ง แล้วเลือกว่าใครกินอะไร ระบบหารให้เอง</p>

  <section>
    <h2>1. คนในวง</h2>
    <div class="row">
      <input id="pname" class="grow" type="text" placeholder="ชื่อเพื่อน" maxlength="20">
      <button id="addP">เพิ่ม</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section>
    <h2>2. รายการที่สั่ง</h2>
    <div class="row">
      <input id="iname" class="grow" type="text" placeholder="เช่น เบียร์ช้าง, น้ำแข็ง, กับแกล้ม" maxlength="40">
      <input id="iprice" class="num" type="number" inputmode="decimal" min="0" placeholder="ราคา">
      <input id="iqty" class="num" type="number" inputmode="numeric" min="1" value="1" style="width:70px" aria-label="จำนวน">
      <select id="ipayer" aria-label="คนจ่าย"></select>
      <button id="addI">เพิ่ม</button>
    </div>
    <div id="items" style="margin-top:8px"></div>
  </section>

  <section>
    <h2>3. ค่าบริการ ภาษี และคนจ่ายบิล</h2>
    <div class="opts">
      <label>Service charge <input id="svc" class="num" type="number" inputmode="decimal" min="0" value="0" style="width:70px"> %</label>
      <label>VAT <input id="vat" class="num" type="number" inputmode="decimal" min="0" value="0" style="width:70px"> %</label>
      <label><input id="ceil" type="checkbox"> ปัดขึ้นเป็นบาทเต็ม</label>
      <label>คนจ่ายบิลก่อน (ทั้งบิล) <select id="dpayer"></select></label>
    </div>
  </section>

  <section>
    <h2>สรุปว่าใครจ่ายเท่าไหร่</h2>
    <div id="result"></div>
    <div class="row" style="margin-top:12px">
      <button id="copy" class="ghost">คัดลอกสรุป</button>
      <button id="reset" class="ghost">ล้างทั้งหมด</button>
      <span id="msg" class="muted" style="align-self:center"></span>
    </div>
  </section>
</main>

<script>
(function(){
  var state={people:[],items:[],svc:0,vat:0,ceil:false,nid:1};
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmt(n){return n.toLocaleString('th-TH',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
  function save(){try{localStorage.setItem('hanrerng',JSON.stringify(state))}catch(e){}}
  function load(){try{var s=JSON.parse(localStorage.getItem('hanrerng'));if(s&&Array.isArray(s.people)&&Array.isArray(s.items)){state=s}}catch(e){}}

  function addPerson(){
    var n=$('pname').value.trim();if(!n)return;
    var id=state.nid++;state.people.push({id:id,name:n});
    state.items.forEach(function(it){it.who.push(id)});
    $('pname').value='';render();$('pname').focus();
  }
  function addItem(){
    var n=$('iname').value.trim(),p=parseFloat($('iprice').value),q=parseInt($('iqty').value,10)||1;
    if(!n||isNaN(p)||p<0)return;
    state.items.push({id:state.nid++,name:n,price:p,qty:Math.max(1,q),who:state.people.map(function(x){return x.id}),payer:$('ipayer').value?+$('ipayer').value:null});
    $('iname').value='';$('iprice').value='';$('iqty').value=1;render();$('iname').focus();
  }
  function calc(){
    var f=(1+state.svc/100)*(1+state.vat/100),sub={},base=0,subP={},paid={},paidItems={};
    state.people.forEach(function(p){sub[p.id]=0;subP[p.id]=0;paid[p.id]=0;paidItems[p.id]=[]});
    state.items.forEach(function(it){
      var t=it.price*it.qty,w=it.who.filter(function(id){return sub[id]!==undefined});
      base+=t;
      if(!w.length)return;
      w.forEach(function(id){sub[id]+=t/w.length;if(it.payer||state.defPayer)subP[id]+=t/w.length});var py=it.payer||state.defPayer;
      if(py&&paid[py]!==undefined){paid[py]+=t*f;paidItems[py].push(it.name+' ('+fmt(t*f)+')')}
    });
    var out=state.people.map(function(p){var v=sub[p.id]*f;return {name:p.name,amt:state.ceil?Math.ceil(v-1e-9):v,paid:paid[p.id],items:paidItems[p.id]}});
    var sum=out.reduce(function(a,b){return a+b.amt},0);
    var bal=state.people.map(function(p){return {name:p.name,v:paid[p.id]-subP[p.id]*f}}),cr=bal.filter(function(b){return b.v>0.005}).sort(function(a,b){return b.v-a.v}),db=bal.filter(function(b){return b.v<-0.005}).sort(function(a,b){return a.v-b.v}),tr=[],i=0,j=0;
    while(i<db.length&&j<cr.length){var m=Math.min(-db[i].v,cr[j].v);var amt=state.ceil?Math.ceil(m-1e-9):Math.round(m*100)/100;if(amt>0)tr.push({from:db[i].name,to:cr[j].name,amt:amt});db[i].v+=m;cr[j].v-=m;if(db[i].v>-0.005)i++;if(cr[j].v<0.005)j++}
    return {rows:out,sum:sum,transfers:tr,base:base,unassigned:state.items.filter(function(it){return !it.who.length}).length};
  }
  function payOpts(sel){return '<option value="">— ใครจ่ายให้ก่อน —</option>'+state.people.map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')}
  function render(){
    $('chips').innerHTML=state.people.map(function(p){return '<span class="chip">'+esc(p.name)+'<button class="x" data-rp="'+p.id+'" aria-label="ลบ">×</button></span>'}).join('')||'<span class="muted">ยังไม่มีใคร</span>';
    $('items').innerHTML=state.items.length?state.items.map(function(it){
      var who=state.people.map(function(p){var on=it.who.indexOf(p.id)>-1;return '<label class="'+(on?'on':'')+'"><input type="checkbox" data-it="'+it.id+'" data-pp="'+p.id+'"'+(on?' checked':'')+'>'+esc(p.name)+'</label>'}).join('');
      return '<div class="item"><div class="row" style="justify-content:space-between;align-items:center"><div><b>'+esc(it.name)+'</b> <span class="muted">'+fmt(it.price)+' × '+it.qty+' = '+fmt(it.price*it.qty)+' บาท</span></div><button class="x" data-ri="'+it.id+'" aria-label="ลบ">×</button></div><div class="who">'+who+'</div><div class="muted" style="margin-top:8px">คนจ่ายให้ก่อน: <select data-pay="'+it.id+'">'+payOpts(it.payer)+'</select></div></div>';
    }).join(''):'<div class="empty">ยังไม่มีรายการ</div>';
    var r=calc();
    if(!state.people.length||!state.items.length){$('result').innerHTML='<div class="empty">เพิ่มคนและรายการก่อน แล้วผลจะแสดงที่นี่</div>'}
    else{
      $('result').innerHTML=r.rows.map(function(x){return '<div class="res" style="flex-wrap:wrap"><span>'+esc(x.name)+'</span><b>'+fmt(x.amt)+' บาท</b>'+(x.items.length?'<div class="muted" style="width:100%">จ่ายไปแล้ว: '+esc(x.items.join(', '))+' = '+fmt(x.paid)+' บาท</div>':'')+'</div>'}).join('')+
      '<div class="total"><span>รวมทั้งหมด</span><span>'+fmt(r.sum)+' บาท</span></div>'+
      (r.transfers.length?'<h2 style="margin-top:16px">ใครต้องโอนให้ใคร</h2>'+r.transfers.map(function(t){return '<div class="res"><span>'+esc(t.from)+' → '+esc(t.to)+'</span><b>'+fmt(t.amt)+' บาท</b></div>'}).join(''):(state.defPayer||state.items.some(function(i){return i.payer})?'':'<p class="muted">เลือก “คนจ่ายให้ก่อน” ในแต่ละรายการ เพื่อดูว่าใครต้องโอนให้ใคร</p>'))+
      (r.unassigned?'<p class="muted">มี '+r.unassigned+' รายการที่ยังไม่ได้เลือกคนหาร (ไม่ถูกนับ)</p>':'');
    }
    $('dpayer').innerHTML=payOpts(state.defPayer||null).replace('— ใครจ่ายให้ก่อน —','— ไม่ระบุ —');var cur=$('ipayer').value;$('ipayer').innerHTML=payOpts(cur?+cur:null);
    $('svc').value=state.svc;$('vat').value=state.vat;$('ceil').checked=state.ceil;
    save();
  }
  function summary(){
    var r=calc(),L=['🍻 สรุปหารค่าเหล้า'];
    r.rows.forEach(function(x){L.push(x.name+': '+fmt(x.amt)+' บาท')});
    L.push('รวม '+fmt(r.sum)+' บาท');if(r.transfers.length){L.push('','ต้องโอน:');r.transfers.forEach(function(t){L.push(t.from+' → '+t.to+' '+fmt(t.amt)+' บาท')})}return L.join('\n');
  }
  $('addP').onclick=addPerson;$('addI').onclick=addItem;
  $('pname').onkeydown=function(e){if(e.key==='Enter')addPerson()};
  ['iname','iprice','iqty'].forEach(function(id){$(id).onkeydown=function(e){if(e.key==='Enter')addItem()}});
  document.addEventListener('click',function(e){
    var t=e.target;
    if(t.dataset.rp){var id=+t.dataset.rp;state.people=state.people.filter(function(p){return p.id!==id});state.items.forEach(function(it){it.who=it.who.filter(function(x){return x!==id});if(it.payer===id)it.payer=null});if(state.defPayer===id)state.defPayer=null;render()}
    if(t.dataset.ri){var iid=+t.dataset.ri;state.items=state.items.filter(function(i){return i.id!==iid});render()}
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='dpayer'){state.defPayer=t.value?+t.value:null;render();return}
    if(t.dataset&&t.dataset.pay){var pi=state.items.filter(function(i){return i.id===+t.dataset.pay})[0];if(pi){pi.payer=t.value?+t.value:null;render()}return}
    if(t.dataset&&t.dataset.it){
      var it=state.items.filter(function(i){return i.id===+t.dataset.it})[0],pid=+t.dataset.pp;
      if(!it)return;
      it.who=it.who.filter(function(x){return x!==pid});if(t.checked)it.who.push(pid);render();
    }
  });
  $('svc').oninput=function(){state.svc=Math.max(0,parseFloat(this.value)||0);var r=calc();render2()};
  $('vat').oninput=function(){state.vat=Math.max(0,parseFloat(this.value)||0);render2()};
  $('ceil').onchange=function(){state.ceil=this.checked;render2()};
  function render2(){ // re-render only the result so inputs keep focus
    var a=document.activeElement;var id=a&&a.id;render();if(id&&$(id)&&id!=='ceil'){var el=$(id);el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}
  }
  $('copy').onclick=function(){
    var txt=summary();
    function ok(){$('msg').textContent='คัดลอกแล้ว ✓';setTimeout(function(){$('msg').textContent=''},2000)}
    function fb(){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){$('msg').textContent='คัดลอกไม่ได้'}document.body.removeChild(ta)}
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
  };
  $('reset').onclick=function(){if(confirm('ล้างข้อมูลทั้งหมด?')){state={people:[],items:[],svc:0,vat:0,ceil:false,nid:1};render()}};
  load();render();
})();
</script>
</body>
</html>
